<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://*.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="برنامه‌ریز روزانه و ماهانه با تقویم شمسی، یادداشت، یادآوری و جایزه">
<title>برنامه‌ی روزانه</title>
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تسک‌ها">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#0b0c10; --s1:#14161c; --s2:#1c1f27; --s3:#262a35; --line:#252933;
  --tx:#eceef3; --mu:#8e95a4; --ac:#8fa8ff; --acx:#0b0c10; --red:#ff8d8d; --grn:#6fd3a8;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f3f3f0; --s1:#ffffff; --s2:#eeeeea; --s3:#e4e4df; --line:#e1e1db;
  --tx:#16171b; --mu:#666b77; --ac:#3556d6; --acx:#ffffff; --red:#c93c3c; --grn:#1f9d6e;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
[data-theme=light] body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0b0c10;z-index:60}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--tx)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:10px}
.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:600px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 130px)}

/* ---------- header ---------- */
.head{
  position:sticky;top:0;z-index:20;margin:0 -16px 14px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)
}
.hrow{display:flex;align-items:center;gap:12px}
.hg{flex:1;min-width:0}
.hg h1{font-size:21px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hg p{color:var(--mu);font-size:14px;line-height:1.5}
.tools{display:flex;gap:0;flex:none}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--mu);transition:background .15s,color .15s;flex:none;position:relative}
.ib:hover,.ib:active{background:var(--s1);color:var(--tx)}
.ib.sm{width:40px;height:40px}
.lvn{position:absolute;bottom:3px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:var(--acx);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);overflow:hidden;flex:none}
.av .i{width:28px;height:28px;stroke-width:1.6}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avb{position:relative;flex:none;border-radius:16px}
.sd{position:absolute;bottom:-2px;inset-inline-end:-2px;width:13px;height:13px;border-radius:50%;border:2px solid var(--bg);background:var(--mu)}
.sd.ok{background:var(--grn)}.sd.sync{background:#ffb86b}.sd.error{background:var(--red)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.ct{
  flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);color:var(--mu);
  display:flex;align-items:center;gap:7px;font-size:14.5px;white-space:nowrap;transition:background .15s
}
.ct .i{width:18px;height:18px;color:var(--c,currentColor)}
.ct[aria-pressed=true]{color:var(--tx);border-color:var(--c,var(--tx));background:color-mix(in srgb,var(--c,var(--tx)) 16%,transparent)}
.ct.edit{padding:0 12px;border-style:dashed}
.cnt{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--c,var(--ac));color:#0b0c10;font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}

/* ---------- quick capture ---------- */
.qin{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:4px 4px 4px 4px;margin-bottom:14px}
.qin:focus-within{border-color:var(--ac)}
.qin>.i{color:var(--ac);margin-inline:14px 2px}
.qin input{flex:1;min-width:0;background:none;border:0;font-size:16px;padding:12px 4px;outline:none}
.qin button{width:44px;height:44px;border-radius:15px;background:var(--ac);color:var(--acx);display:grid;place-items:center;flex:none}

/* ---------- hero (now / next) ---------- */
.hero{border-radius:26px;background:var(--s1);border:1px solid var(--line);padding:6px;margin-bottom:16px}
.hb{display:block;width:100%;padding:14px 16px;border-radius:20px;border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);margin-bottom:6px}
.hb:last-child{margin-bottom:0}
.lab{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--mu)}
.lab .i{width:16px;height:16px}
.big{display:block;font-size:34px;font-weight:700;line-height:1.35;margin-top:2px}
.big small{font-size:16px;font-weight:500;color:var(--mu);white-space:nowrap}
.big.lg{font-size:25px}
.htitle{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.hsub{display:block;font-size:14px;color:var(--mu);margin-top:2px}
.hl{padding:14px 16px}
.hl .big.sm{font-size:19px;margin-top:4px}
.prog{display:block;height:5px;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,transparent);margin:10px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:3px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:pl 1.8s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--grn) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.hmore{display:flex;flex-direction:column}
.hmore button{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14.5px;border-radius:14px}
.hmore button:hover{background:var(--s2)}
.hmore i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.hmore span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmore small{color:var(--mu);font-size:13px;flex:none}
.late-bar{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-size:14.5px;margin-bottom:16px}
.late-bar span{flex:1}
.late-bar .i{width:18px;height:18px}

/* ---------- week strip ---------- */
.wk{margin-bottom:6px}
.wkh{display:flex;align-items:center;justify-content:space-between}
.wkt{font-size:15px;font-weight:600;padding:8px 12px;border-radius:12px}
.wkg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{height:72px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--s1);transition:background .15s}
.wd small{font-size:12.5px;color:var(--mu)}
.wd b{font-size:17px;font-weight:600}
.wd.red b,.wd.red small{color:var(--red)}
.wd.today{box-shadow:inset 0 0 0 1.5px var(--ac)}
.wd.sel{background:var(--ac)}
.wd.sel b,.wd.sel small{color:var(--acx)}
.dots{display:flex;gap:3px;height:5px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.dots i.d{opacity:.35}
.sel .dots i{background:var(--acx);opacity:.75}

/* ---------- day section ---------- */
.dh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:18px 2px 6px}
.dh h2{font-size:21px;font-weight:700;line-height:1.4}
.dh h2 small{font-size:14px;font-weight:400;color:var(--mu);margin-inline-start:8px}
.hol{display:inline-block;margin-top:2px;padding:1px 10px;border-radius:999px;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);font-size:13px}
.vt{display:flex;background:var(--s1);border-radius:12px;padding:3px;flex:none}
.vt button{width:38px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mu)}
.vt button[aria-pressed=true]{background:var(--s3);color:var(--tx)}
.pg{height:4px;border-radius:2px;background:var(--s2);margin:6px 2px 4px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--grn);border-radius:2px;transition:width .3s}
.pgt{font-size:13px;color:var(--mu);margin:0 2px 10px}

/* ---------- task cards ---------- */
.card{display:flex;align-items:flex-start;gap:2px;background:var(--s1);border-radius:18px;border-inline-start:3px solid var(--c);margin-bottom:8px;padding-inline-end:6px}
.chk{width:46px;height:46px;flex:none;display:grid;place-items:center}
.chk span{width:24px;height:24px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk .i{width:14px;height:14px;stroke:var(--acx);stroke-width:3;opacity:0}
.done .chk span{background:var(--c);border-color:var(--c)}
.done .chk .i{opacity:1}
.pop .chk span{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.tb{flex:1;min-width:0;display:block;padding:11px 0 12px}
.tt{display:block;font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.td{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;color:var(--mu);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.mt2{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tc{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:var(--s2);font-size:13px;color:var(--mu);white-space:nowrap}
.tc .i{width:14px;height:14px}
.tc.time{color:var(--tx);font-weight:500}
.tc.late{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.tc.cat{color:var(--tx);background:color-mix(in srgb,var(--c) 16%,transparent)}
.tc.cat .i{color:var(--c)}
.tc.xp{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);font-weight:600}
.done .tt{color:var(--mu);text-decoration:line-through;text-decoration-thickness:1px}
.done .td,.done .tc{opacity:.6}
.hist.done .tt{color:var(--tx);text-decoration:none}
.hist.done .tc{opacity:1}
.empty{text-align:center;color:var(--mu);padding:34px 0 20px}
.empty .i{width:34px;height:34px;opacity:.5;stroke-width:1.5}
.empty p{margin-top:8px}
.empty button{margin-top:10px;color:var(--ac);font-weight:600;padding:10px 18px;border-radius:12px;background:var(--s1)}

/* ---------- timeline ---------- */
.tl{position:relative;margin:6px 0 4px}
.hr{position:absolute;inset-inline-start:50px;inset-inline-end:0;border-top:1px solid var(--line)}
.hr span{position:absolute;inset-inline-start:-50px;top:-11px;width:42px;font-size:12px;color:var(--mu)}
.tblk{
  position:absolute;border-radius:14px;border-inline-start:3px solid var(--c);overflow:hidden;
  background:color-mix(in srgb,var(--c) 22%,var(--s1));display:flex;align-items:flex-start;gap:0;z-index:2
}
.tblk .chk{width:34px;height:34px}
.tblk .chk span{width:20px;height:20px}
.tblk .chk .i{width:12px;height:12px}
.tblk .bb{flex:1;min-width:0;padding:6px 0 4px;display:block}
.tblk .bt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;font-weight:600;line-height:1.45}
.tblk .bs{display:block;font-size:12.5px;color:var(--mu)}
.tblk.cp .bt{-webkit-line-clamp:1;line-height:1.5}
.tblk.cp .bb{padding:5px 0 2px}
.tblk.done{opacity:.55}
.tblk.done .bt{text-decoration:line-through}
.nowline{position:absolute;inset-inline-start:46px;inset-inline-end:0;height:2px;background:var(--red);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;inset-inline-start:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.alld{margin-bottom:6px}
.sublab{font-size:13px;color:var(--mu);margin:8px 2px 6px}

/* ---------- month ---------- */
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mh .mtt{font-size:19px;font-weight:700;padding:8px 12px;border-radius:12px}
.dow,.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow span{text-align:center;font-size:13px;color:var(--mu);padding:2px 0 6px}
.dow span.f{color:var(--red);opacity:.9}
.mc{min-height:88px;border-radius:12px;background:var(--s1);padding:4px 2px 3px;display:flex;flex-direction:column;gap:2px;align-items:stretch;overflow:hidden;transition:background .15s}
.mc .n{font-size:13.5px;font-weight:600;padding:0 3px;height:24px;display:flex;align-items:center}
.mc.red .n{color:var(--red)}
.mc.today .n{background:var(--ac);color:var(--acx);width:24px;border-radius:50%;justify-content:center;padding:0}
.mc.sel{box-shadow:inset 0 0 0 2px var(--ac)}
.bar{display:block;font-size:10px;line-height:15px;height:15px;padding:0 3px;border-radius:5px;border-inline-start:2px solid var(--c);background:color-mix(in srgb,var(--c) 26%,transparent);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar.d{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--mu);padding:0 4px}

/* ---------- list / notes ---------- */
.lsum{display:flex;align-items:center;gap:12px;padding:6px 2px 4px}
.lsum .ico{width:48px;height:48px;border-radius:16px;background:color-mix(in srgb,var(--c,var(--ac)) 18%,transparent);color:var(--c,var(--ac));display:grid;place-items:center}
.lsum .ico .i{width:24px;height:24px}
.lsum b{display:block;font-size:20px;font-weight:700;line-height:1.4}
.lsum small{color:var(--mu);font-size:14px}
.gh{display:flex;align-items:baseline;justify-content:space-between;padding:20px 2px 8px}
.gh h3{font-size:16.5px;font-weight:700}
.gh h3 small{font-size:13.5px;font-weight:400;color:var(--mu);margin-inline-start:8px}
.gh span{font-size:13px;color:var(--mu)}
.gh.late h3{color:var(--red)}
.nadd{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px;margin:10px 0 14px}
.nadd:focus-within{border-color:var(--ac)}
.nadd textarea{width:100%;min-height:70px;background:none;border:0;resize:none;font-size:16px;outline:none;padding:6px 8px}
.nadd .nb{display:flex;justify-content:space-between;align-items:center}
.nadd .nb small{color:var(--mu);font-size:13px;padding-inline-start:8px}
.nbtn{height:42px;padding:0 18px;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:700;display:flex;align-items:center;gap:7px}
.note{background:var(--s1);border-radius:18px;padding:2px;margin-bottom:8px}
.nt{display:block;width:100%;padding:12px 14px 4px}
.nt .tx2{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.nt small{display:block;color:var(--mu);font-size:13px;margin-top:6px}
.na{display:flex;gap:6px;padding:4px 8px 8px}
.na .pill{flex:1;height:42px;border-radius:13px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.na .ib{width:42px;height:42px}

/* ---------- dock ---------- */
.dockwrap{position:fixed;inset:auto 0 0 0;display:flex;justify-content:center;pointer-events:none;z-index:30}
.dockin{width:100%;max-width:600px;padding:0 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;align-items:center}
.fab{pointer-events:auto;width:60px;height:60px;border-radius:30px;background:var(--ac);color:var(--acx);display:grid;place-items:center;flex:none;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.fab .i{width:26px;height:26px;stroke-width:2.4}
.dock{
  pointer-events:auto;flex:1;height:60px;border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;gap:2px;
  background:color-mix(in srgb,var(--s1) 88%,transparent);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 10px 26px rgba(0,0,0,.28)
}
.dock button{position:relative;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--mu);font-size:12px;line-height:1.3;text-align:center}
.dock button .i{width:21px;height:21px}
.dock button[aria-pressed=true]{background:var(--s3);color:var(--tx)}
.dock button[aria-pressed=true] .i{color:var(--ac)}
.dock .bdg{position:absolute;top:3px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:var(--acx);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}

/* ---------- toast ---------- */
.toast{
  position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-160%);width:calc(100% - 28px);max-width:490px;z-index:70;
  background:var(--s3);color:var(--tx);border-radius:18px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;
  box-shadow:0 12px 34px rgba(0,0,0,.4);transition:transform .3s ease
}
.toast.show{transform:translate(-50%,0)}
.toast .tm{flex:1;font-size:14.5px}
.toast .tm .i{width:16px;height:16px;vertical-align:-3px;color:var(--ac)}
.toast .ta{color:var(--ac);font-weight:700;padding:8px 10px;border-radius:10px;font-size:14.5px}
.toast .tx{width:36px;height:36px;display:grid;place-items:center;color:var(--mu)}
.toast .tx .i{width:18px;height:18px}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
.sheet.open{visibility:visible}
.back{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.sheet.open .back{opacity:1}
.panel{
  position:relative;width:100%;max-width:600px;height:94vh;height:94dvh;background:var(--s1);border-radius:28px 28px 0 0;
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease
}
.panel.auto{height:auto;max-height:92vh;max-height:92dvh}
.sheet.open .panel{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--s3);margin:10px auto 6px;flex:none}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 16px;overscroll-behavior:contain}
.pfoot{flex:none;display:flex;gap:10px;padding:10px 18px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);background:var(--s1)}
.panel.auto .pbody{padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph h2{font-size:20px;font-weight:700}
.panel h3{font-size:15px;color:var(--mu);font-weight:500;margin:24px 0 8px}

<script>
(function(){
'use strict';

/* ======================= Jalali calendar ======================= */
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
  let gy=jy+621,leapJ=-14,jp=BR[0],jm,jump=0,leap,leapG,march,n,i;
  for(i=1;i<BR.length;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;
  leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return {leap,gy,march};
}
function g2d(gy,gm,gd){
  let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;

}
function d2g(jdn){
  let j=4*jdn+139361631;
  j+=div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  const i=div(mod(j,1461),4)*5+308;
  const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1;
  return {gy:div(j,1461)-100100+div(8-gm,6),gm,gd};

  const g=d2g(jdn);let jy=g.gy-621;
  const r=jalCal(jy),f=g2d(g.gy,3,r.march);

const jOfMs=ms=>{const n=new Date(ms);return g2d(n.getFullYear(),n.getMonth()+1,n.getDate())};

const PD='۰۱۲۳۴۵۶۷۸۹';
const fa=n=>String(n).replace(/\d/g,d=>PD[d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const holName=j=>{const p=d2j(j);return HOL[p.jm+'-'+p.jd]||''};
const isRed=j=>wdIdx(j)===6||!!holName(j);

let T=todayJ();
const relDay=j=>{const d=j-T;return d===0?'امروز':d===1?'فردا':d===2?'پس‌فردا':d===-1?'دیروز':null};
const dayLabel=j=>{const p=d2j(j);return WD[wdIdx(j)]+' '+fa(p.jd)+' '+MONTHS[p.jm-1]};
const shortDate=j=>{const p=d2j(j);return fa(p.jd)+' '+MONTHS[p.jm-1]+(p.jy!==d2j(T).jy?' '+fa(p.jy):'')};

/* time helpers */
const hm=t=>{const p=t.split(':');return (+p[0])*60+(+p[1])};

const tsEnd=(t,j)=>tsStart(t,j)+(t.dur||0)*60000;

const clockOf=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
function human(ms){
  const m=Math.round(ms/60000);
  if(m<1)return 'کمتر از ۱ دقیقه';
  if(m<60)return fa(m)+' دقیقه';
  const h=Math.floor(m/60),r=m%60;
  if(h<24)return fa(h)+' ساعت'+(r?' و '+fa(r)+' دقیقه':'');
  const d=Math.floor(h/24),hh=h%24;
  return fa(d)+' روز'+(hh?' و '+fa(hh)+' ساعت':'');

  const d=Date.now()-ms,m=Math.floor(d/60000);
  if(m<1)return 'همین الان';
  if(m<60)return fa(m)+' دقیقه پیش';
  if(m<1440)return fa(Math.floor(m/60))+' ساعت پیش';
  const j=jOfMs(ms);
  return T-j===1?'دیروز':shortDate(j);

function greetWord(){const h=new Date().getHours();return h<5?'شبت بخیر':h<11?'صبحت بخیر':h<16?'روزت بخیر':h<19?'عصرت بخیر':'شبت بخیر'}

/* ======================= Icons ======================= */
const P={

  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  listi:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/>',
  timeline:'<path d="M4.5 4v16"/><rect x="9" y="5" width="11" height="5.5" rx="1.8"/><rect x="9" y="13.5" width="7.5" height="5.5" rx="1.8"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  calplus:'<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 12.5v5M9.5 15h5"/>',

function occurs(t,j){
  if(j<t.date)return false;
  switch(t.repeat){
    case 'daily':return true;
    case 'weekly':return (j-t.date)%7===0;
    case 'monthly':{const a=d2j(t.date),b=d2j(j);return b.jd===Math.min(a.jd,mLen(b.jy,b.jm))}
    default:return j===t.date;
  }
}
const visible=t=>U.filter===null||t.cat===U.filter;
const isOverdue=t=>t.repeat==='none'&&t.date<T&&!t.done[t.date];
const sortKey=t=>t.time?hm(t.time):-1;
const tasksOn=j=>S.tasks.filter(t=>visible(t)&&occurs(t,j)).sort((a,b)=>sortKey(a)-sortKey(b)||a.created-b.created);
const anyOn=j=>S.tasks.some(t=>(!F||t.id!==F.id)&&occurs(t,j));
function badge(cid){
  let n=0;
  S.tasks.forEach(t=>{
    if(cid&&t.cat!==cid)return;
    if(occurs(t,T)&&!t.done[T])n++;else if(isOverdue(t))n++;
  });
  return n;
}
function isLate(t,j){
  if(t.done[j])return false;
  if(j<T)return true;
  if(j>T||!t.time)return false;
  return Date.now()>(t.dur?tsEnd(t,j):tsStart(t,j));
}
function computeLive(){
  const now=Date.now();let cur=null;const next=[];
  for(let d=0;d<=60&&next.length<3;d++){
    const j=T+d;
    for(let i=0;i<S.tasks.length;i++){
      const t=S.tasks[i];
      if(!t.time||!visible(t)||t.done[j]||!occurs(t,j))continue;
      const s=tsStart(t,j),e=tsEnd(t,j);
      if(t.dur>0&&s<=now&&e>now){if(!cur||s>cur.s)cur={t,j,s,e}}
      else if(s>now&&!next.some(n=>n.t.id===t.id))next.push({t,j,s,e});
    }
  }
  next.sort((a,b)=>a.s-b.s);
  return {cur,next:next.slice(0,3)};
}
function nextUntimed(){
  for(let d=0;d<=60;d++){
    const j=T+d,ts=tasksOn(j).filter(t=>!t.time&&!t.done[j]);
    if(ts.length)return {t:ts[0],j,n:ts.length};
  }
  return null;
}

function timelineHTML(ts,j){
  const timed=ts.filter(t=>t.time),HH=64;
  const items=timed.map(t=>({t,s:hm(t.time),e:hm(t.time)+Math.max(t.dur||0,50)})).sort((a,b)=>a.s-b.s||b.e-a.e);
  const mn=Math.min.apply(null,items.map(i=>i.s)),mx=Math.max.apply(null,items.map(i=>i.e));
  let s=Math.max(0,Math.floor(mn/60)-1),e=Math.min(24,Math.ceil(mx/60)+1);
  if(e-s<5){e=Math.min(24,s+5);s=Math.max(0,e-5)}
  let cols=[],cluster=[],cEnd=-1;
  const flush=()=>{const n=cols.length;cluster.forEach(it=>{it.n=n});cols=[];cluster=[];cEnd=-1};
  items.forEach(it=>{
    if(cluster.length&&it.s>=cEnd)flush();
    let c=cols.findIndex(end=>end<=it.s);
    if(c<0){c=cols.length;cols.push(0)}
    cols[c]=it.e;it.c=c;cluster.push(it);cEnd=Math.max(cEnd,it.e);
  });
  flush();
  const LBL=50;let lines='',blocks='';
  for(let k=s;k<=e;k++)lines+='<div class="hr" style="top:'+((k-s)*HH)+'px">'+(k<24?'<span>'+fa(pad(k)+':00')+'</span>':'')+'</div>';
  items.forEach(it=>{
    const t=it.t,c=catOf(t.cat),done=!!t.done[j];
    const top=(it.s-s*60)/60*HH+1,h=(it.e-it.s)/60*HH-3;
    blocks+='<div class="tblk'+(h<72?' cp':'')+(done?' done':'')+(U.pop===t.id+'@'+j?' pop':'')+'" style="--c:'+c.color+';top:'+top+'px;height:'+h+'px;inset-inline-start:calc('+LBL+'px + '+it.c+' * (100% - '+LBL+'px) / '+it.n+' + 2px);width:calc((100% - '+LBL+'px) / '+it.n+' - 4px)">'+
      '<button class="chk" data-act="toggle" data-id="'+t.id+'" data-d="'+j+'" role="checkbox" aria-checked="'+done+'" aria-label="انجام شد: '+esc(t.title)+'"><span>'+ic('check')+'</span></button>'+
      '<button class="bb" data-act="edit" data-id="'+t.id+'"><span class="bt">'+esc(t.title)+'</span><span class="bs">'+timeRange(t)+'</span></button></div>';
  });
  let now='';
  if(j===T){const d=new Date(),m=d.getHours()*60+d.getMinutes();if(m>=s*60&&m<=e*60)now='<div class="nowline" id="nowline" data-s="'+s+'" data-hh="'+HH+'" style="top:'+((m-s*60)/60*HH)+'px"></div>'}
  return '<div class="tl" style="height:'+((e-s)*HH)+'px">'+lines+blocks+now+'</div>';
}

function upHTML(){
  const hc=U.filter!==null,groups=[];
  const od=S.tasks.filter(t=>visible(t)&&isOverdue(t)).sort((a,b)=>a.date-b.date||sortKey(a)-sortKey(b));
  if(od.length)groups.push({late:true,title:'عقب‌افتاده',items:od.map(t=>({t,j:t.date})),showDate:true});

  }
  const later=S.tasks.filter(t=>visible(t)&&t.repeat==='none'&&t.date>T+60&&!t.done[t.date]).sort((a,b)=>a.date-b.date);
  if(later.length){up+=later.length;groups.push({title:'بعدتر',items:later.map(t=>({t,j:t.date})),showDate:true})}

function openSheet(bodyHTML,footHTML,opts){
  opts=opts||{};
  const old=panel.querySelector('.pbody'),st=old?old.scrollTop:0;
  sheetLocked=!!opts.lock;
  panel.className='panel'+(opts.auto?' auto':'');
  panel.innerHTML='<div class="grab"></div><div class="pbody">'+bodyHTML+'</div>'+(footHTML?'<div class="pfoot">'+footHTML+'</div>':'');
  const nb=panel.querySelector('.pbody');if(opts.keepScroll&&nb)nb.scrollTop=st;
  if(!sheet.classList.contains('open')){
    sheet.classList.add('open');document.body.style.overflow='hidden';
    setTimeout(()=>{const f=opts.focus&&panel.querySelector(opts.focus);(f||panel).focus({preventScroll:true})},80);
  }
}
function closeSheet(){sheetLocked=false;sheet.classList.remove('open');document.body.style.overflow=''}
const sheetOpen=()=>sheet.classList.contains('open');

function saveTask(){
  const ti=$('#f-title');F.title=ti.value;F.desc=$('#f-desc').value;
  const title=F.title.trim();
  if(!title){ti.classList.add('err');ti.focus();return}
  const rec={title:title.slice(0,120),desc:F.desc.trim().slice(0,2000),cat:F.cat,repeat:F.repeat,date:F.date,time:F.timed?F.time||'09:00':'',dur:F.timed?F.dur:0,rem:F.timed?F.rem:-1};
  if(F.id){
    const t=S.tasks.find(x=>x.id===F.id),had=Object.keys(t.done).length>0;
    Object.assign(t,rec);
    if(rec.repeat==='none')t.done=had?{[rec.date]:t.done[rec.date]||Date.now()}:{};
    touch(t);
  }else S.tasks.push(touch(Object.assign({id:uid(),done:{},created:Date.now()},rec)));
  let moved=false;
  if(F.fromNote){S.notes=S.notes.filter(n=>n.id!==F.fromNote);kill(F.fromNote);S.conv++;moved=true}
  const nb=evalBadges(null);
  if(U.filter!==null&&U.filter!==rec.cat)U.filter=null;
  setSel(rec.date);persist();closeSheet();render();checkReminders();
  if(moved)toast('از یادداشت‌ها حذف شد و به '+dayLabel(rec.date)+' رفت','نمایش',()=>{U.tab='plan';setSel(rec.date);render()},6000);
  if(nb.length)setTimeout(()=>badgeToast(nb),moved?300:0);
}

/* ---------- PIN lock ---------- */
const lockCfg=()=>{let r=null;try{r=localStorage.getItem(LK)}catch(e){r=mem[LK]||null}try{return r?JSON.parse(r):null}catch(e){return null}};
const saveLock=c=>{const s=c?JSON.stringify(c):null;try{if(s)localStorage.setItem(LK,s);else localStorage.removeItem(LK)}catch(e){mem[LK]=s}};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
const dotsPin=n=>'<div class="pdots" aria-label="'+fa(n)+' از ۴ رقم">'+[0,1,2,3].map(i=>'<i class="'+(i<n?'on':'')+'"></i>').join('')+'</div>';
function keypadHTML(act){
  const k=['1','2','3','4','5','6','7','8','9','','0','del'];
  return '<div class="kp">'+k.map(x=>x===''?'<button class="n" tabindex="-1" aria-hidden="true"></button>':x==='del'?'<button data-act="'+act+'" data-k="del" aria-label="پاک کردن">'+ic('backsp')+'</button>':'<button data-act="'+act+'" data-k="'+x+'">'+fa(x)+'</button>').join('')+'</div>';
}
let pinBuf='',lockMsg='',fails=0,lockedUntil=0,hiddenAt=0;
function renderLock(shake){
  const el=$('#lock');
  el.innerHTML='<div class="lk">'+ic('lock')+'</div><h2>برنامه قفل است</h2><p style="color:var(--mu)">رمز ۴ رقمی را وارد کن</p><div class="'+(shake?'shake':'')+'">'+dotsPin(pinBuf.length)+'</div><div class="msg" role="alert">'+lockMsg+'</div>'+keypadHTML('lk')+'<button class="skip" data-act="lkforget">رمز را فراموش کرده‌ام</button>';
}
function showLock(){LOCKED=true;pinBuf='';lockMsg='';$('#lock').hidden=false;renderLock();render()}
async function lockInput(k){
  if(Date.now()<lockedUntil){lockMsg='چند لحظه صبر کن و دوباره امتحان کن';renderLock();return}
  if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
  lockMsg='';renderLock();
  if(pinBuf.length<4)return;
  const cfg=lockCfg();if(!cfg){unlock();return}
  const h=await sha(cfg.salt+pinBuf);
  if(h===cfg.hash){unlock();return}
  fails++;pinBuf='';
  if(fails>=5){lockedUntil=Date.now()+30000;fails=0;lockMsg='۵ بار اشتباه؛ ۳۰ ثانیه صبر کن'}else lockMsg='رمز اشتباه است';
  renderLock(true);
}
function unlock(){LOCKED=false;pinBuf='';fails=0;$('#lock').hidden=true;render();if(!S.profile)openOnboarding()}
let PS=null;
function openSetPin(){PS={step:1,first:'',buf:'',err:''};renderSetPin()}
function renderSetPin(){
  openSheet('<div class="ph"><h2>قفل برنامه</h2><button class="ib" data-act="close" aria-label="بستن">'+ic('close')+'</button></div>'+
    '<div style="text-align:center"><p>'+(PS.step===1?'یک رمز ۴ رقمی انتخاب کن':'رمز را دوباره وارد کن')+'</p>'+dotsPin(PS.buf.length)+'<div class="msg" role="alert">'+PS.err+'</div>'+keypadHTML('ps')+'</div>',null,{auto:true});
}
async function setPinInput(k){
  if(k==='del')PS.buf=PS.buf.slice(0,-1);else if(PS.buf.length<4)PS.buf+=k;
  PS.err='';
  if(PS.buf.length<4){renderSetPin();return}
  if(PS.step===1){PS.first=PS.buf;PS.buf='';PS.step=2;renderSetPin();return}
  if(PS.buf!==PS.first){PS.step=1;PS.first='';PS.buf='';PS.err='رمزها یکی نبودند؛ دوباره شروع کن';renderSetPin();return}
  const a=new Uint8Array(8);crypto.getRandomValues(a);
  const salt=Array.prototype.map.call(a,x=>x.toString(16).padStart(2,'0')).join('');
  saveLock({salt,hash:await sha(salt+PS.buf)});PS=null;
  renderSettings();toast('قفل برنامه فعال شد');
}

let toastTimer=null,toastFn=null;
function toast(msg,label,fn,ms){
  const el=$('#toast');toastFn=fn||null;
  el.innerHTML='<span class="tm">'+msg+'</span>'+(label?'<button class="ta" data-act="toastact">'+label+'</button>':'')+'<button class="tx" data-act="toastx" aria-label="بستن">'+ic('close')+'</button>';
  el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),ms||5000);

function sysNotify(title,body,tag){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const opts={body,tag,icon:'icon-192.png',badge:'icon-192.png',lang:'fa',dir:'rtl',vibrate:[80,40,80]};
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistration().then(r=>{if(r)r.showNotification(title,opts);else new Notification(title,opts)}).catch(()=>{});
    }else new Notification(title,opts);
  }catch(e){}
}
function checkReminders(){
  if(LOCKED)return;
  const now=Date.now();let changed=false;
  for(let d=0;d<=2;d++){
    const j=T+d;
    S.tasks.forEach(t=>{
      if(!t.time||t.rem<0||t.done[j]||!occurs(t,j))return;
      const s=tsStart(t,j),fireAt=s-t.rem*60000;
      if(now<fireAt||now>s+5*60000)return;
      const key=t.id+'@'+j+'@'+t.time+'@'+t.rem;
      if(S.fired[key])return;
      S.fired[key]=now;changed=true;
      const body=(s>now?human(s-now)+' دیگر، ساعت ':'ساعت ')+fa(t.time);
      if(document.visibilityState==='visible'){
        toast('<b>'+esc(t.title)+'</b><br><small>'+body+'</small>','باز کردن',()=>openTask(t.id),9000);
        try{if(navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive)navigator.vibrate([60,40,60])}catch(e){}
      }else sysNotify(t.title,body,key);
    });
  }
  Object.keys(S.fired).forEach(k=>{if(S.fired[k]<now-3*86400000){delete S.fired[k];changed=true}});
  if(changed){
    const s=JSON.stringify({cats:S.cats,tasks:S.tasks,notes:S.notes,log:S.log,badges:S.badges,dead:S.dead,profile:S.profile,conv:S.conv,theme:S.theme,fired:S.fired,owner:S.owner,seeded:S.seeded});
    try{localStorage.setItem(K,s)}catch(e){mem[K]=s}
  }
}

/* ======================= Phone-calendar export (.ics) ======================= */
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const ymd=j=>{const g=d2g(j);return g.gy+pad(g.gm)+pad(g.gd)};
const ymdhm=ms=>{const d=new Date(ms);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'};
function veventLines(t,j,suffix,rrule){
  const L=['BEGIN:VEVENT','UID:'+t.id+suffix+'@tasks-fa','DTSTAMP:'+ymdhm(Date.now())];
  if(t.time){L.push('DTSTART:'+ymdhm(tsStart(t,j)),'DTEND:'+ymdhm(dateMs(j,hm(t.time)+(t.dur||30))))}
  else L.push('DTSTART;VALUE=DATE:'+ymd(j),'DTEND;VALUE=DATE:'+ymd(j+1));
  L.push('SUMMARY:'+icsEsc(t.title));
  if(t.desc)L.push('DESCRIPTION:'+icsEsc(t.desc));
  if(rrule)L.push('RRULE:'+rrule);
  if(t.time&&t.rem>=0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(t.title),'TRIGGER:'+(t.rem===0?'PT0M':'-PT'+t.rem+'M'),'END:VALARM');
  L.push('END:VEVENT');
  return L;
}
function exportICS(t){
  let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TasksFA//FA','CALSCALE:GREGORIAN'];
  if(t.repeat==='monthly'){
    const a=d2j(t.date);
    for(let i=0;i<12;i++){
      let m=a.jm+i,y=a.jy;while(m>12){m-=12;y++}
      L=L.concat(veventLines(t,j2d(y,m,Math.min(a.jd,mLen(y,m))),'-'+i,null));
    }
  }else L=L.concat(veventLines(t,t.date,'',t.repeat==='daily'?'FREQ=DAILY;COUNT=365':t.repeat==='weekly'?'FREQ=WEEKLY;COUNT=104':null));
  L.push('END:VCALENDAR');
  downloadBlob(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'task.ics');
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ======================= Cloud sync (Firebase: Google sign-in + Firestore) ======================= */
const SY={fb:null,user:null,unsub:null,timer:null,remote:{},status:'off',init:false};
const cfgFB=()=>{const c=window.APP_CONFIG&&window.APP_CONFIG.firebase;return c&&c.apiKey&&c.projectId?c:null};
function stable(o){
  if(Array.isArray(o))return '['+o.map(stable).join(',')+']';
  if(o&&typeof o==='object')return '{'+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
  return o===undefined?'null':JSON.stringify(o);
}
const byId=a=>a.slice().sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0);
function buildParts(){
  const parts={main:stable({profile:S.profile,cats:byId(S.cats),tasks:byId(S.tasks),notes:byId(S.notes),dead:S.dead,badges:S.badges,conv:S.conv})};
  const by={};
  S.log.forEach(e=>{const y=d2j(e.j).jy;(by[y]=by[y]||[]).push(e)});
  Object.keys(by).forEach(y=>{parts['log-'+y]=stable({log:byId(by[y])})});
  return parts;
}
function mergeList(local,remote){
  const m=new Map();local.forEach(x=>m.set(x.id,x));
  remote.forEach(r=>{const l=m.get(r.id);if(!l||(r.u||0)>(l.u||0))m.set(r.id,r)});
  const out=[];m.forEach(x=>{const d=S.dead[x.id];if(d&&d>=(x.u||0))return;out.push(x)});
  return out;
}
function mergeRemote(part,raw){
  const before=stable(buildParts());
  if(part==='main'){
    const dd=cleanDead(raw.dead);Object.keys(dd).forEach(k=>{if(dd[k]>(S.dead[k]||0))S.dead[k]=dd[k]});
    const rp=cleanProfile(raw.profile);if(rp&&(!S.profile||rp.u>(S.profile.u||0)))S.profile=rp;
    S.cats=mergeList(S.cats,cleanList(raw.cats,cleanCat,100));
    S.tasks=mergeList(S.tasks,cleanList(raw.tasks,cleanTask,5000));
    S.notes=mergeList(S.notes,cleanList(raw.notes,cleanNote,2000));
    const rb=cleanBadges(raw.badges);Object.keys(rb).forEach(k=>{if(!S.badges[k]||rb[k]<S.badges[k])S.badges[k]=rb[k]});
    S.conv=Math.max(S.conv,clamp(int(raw.conv,0),0,100000));
  }else if(/^log-\d{4}$/.test(part)){
    S.log=mergeList(S.log,cleanList(raw.log,cleanLog,20000));
  }
  return before!==stable(buildParts());
}
function resetLocal(){
  S.cats=JSON.parse(JSON.stringify(DEFAULT_CATS));S.tasks=[];S.notes=[];S.log=[];S.badges={};S.dead={};S.profile=null;S.conv=0;S.fired={};S.seeded=true;
}
async function fbInit(){
  if(SY.fb)return SY.fb;
  const cfg=cfgFB();if(!cfg)return null;
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const mods=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=mods[0].initializeApp(cfg);
  SY.fb={au:mods[1],fs:mods[2],auth:mods[1].getAuth(app),db:mods[2].getFirestore(app)};
  return SY.fb;
}
async function initSync(){
  if(SY.init||!cfgFB())return;
  SY.init=true;
  try{
    const fb=await fbInit();
    fb.au.getRedirectResult(fb.auth).catch(()=>{});
    fb.au.onAuthStateChanged(fb.auth,onUser);
  }catch(e){SY.status='error';SY.init=false}
}
function onUser(user){
  SY.user=user;
  if(SY.unsub){SY.unsub();SY.unsub=null}
  SY.remote={};
  if(!user){SY.status='off';render();if(sheetOpen()&&!sheetLocked)renderSettingsIfOpen();return}
  if(S.owner&&S.owner!==user.uid){resetLocal()}
  S.owner=user.uid;SY.status='sync';
    const fs=SY.fb.fs,col=fs.collection(SY.fb.db,'users',user.uid,'sync');
  SY.unsub=fs.onSnapshot(col,snap=>{
    let changed=false;
    snap.forEach(d=>{
      const js=d.data()&&d.data().json;if(typeof js!=='string'||js.length>1000000)return;
      let raw;try{raw=JSON.parse(js)}catch(e){return}
      SY.remote[d.id]=js;
      if(mergeRemote(d.id,raw))changed=true;
    });
    SY.status='ok';
    if(changed){persistLocalOnly();const wasOb=sheetOpen()&&sheetLocked;if(wasOb&&S.profile)closeSheet();render()}
    else render();
    if(sheetOpen()&&!sheetLocked)renderSettingsIfOpen();
    if(!S.profile&&!LOCKED&&!sheetOpen())openOnboarding();
    pushNow();
  },()=>{SY.status='error';render()});
  persistLocalOnly();render();
}
function persistLocalOnly(){
  const s=JSON.stringify({cats:S.cats,tasks:S.tasks,notes:S.notes,log:S.log,badges:S.badges,dead:S.dead,profile:S.profile,conv:S.conv,theme:S.theme,fired:S.fired,owner:S.owner,seeded:S.seeded});
  try{localStorage.setItem(K,s)}catch(e){mem[K]=s}
}
function scheduleSync(){if(!SY.user||!SY.fb)return;clearTimeout(SY.timer);SY.timer=setTimeout(pushNow,900)}
async function pushNow(){
  if(!SY.user||!SY.fb)return;
  const parts=buildParts(),fs=SY.fb.fs;
  for(const k of Object.keys(parts)){
    if(SY.remote[k]===parts[k])continue;
    if(parts[k].length>950000){toast('حجم داده‌ها برای همگام‌سازی زیاد شده است');continue}
    try{
      await fs.setDoc(fs.doc(SY.fb.db,'users',SY.user.uid,'sync',k),{json:parts[k],u:Date.now()});
      SY.remote[k]=parts[k];
    }catch(e){SY.status='error';render();return}
  }
}
async function signIn(){
  let fb;
  try{fb=await fbInit()}catch(e){toast('اتصال به سرویس گوگل برقرار نشد. اینترنت یا فیلترشکن را بررسی کن.');return}
  if(!fb){toast('همگام‌سازی هنوز راه‌اندازی نشده؛ راهنمای SETUP-FA.md را ببین.');return}
  if(!SY.init){SY.init=true;fb.au.onAuthStateChanged(fb.auth,onUser)}
  const prov=new fb.au.GoogleAuthProvider();
  try{await fb.au.signInWithPopup(fb.auth,prov)}

    const c=e&&e.code;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await fb.au.signInWithRedirect(fb.auth,prov)}catch(e2){toast('ورود انجام نشد')}}
    else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')toast('ورود انجام نشد: '+esc(c||'خطا'));
  }
}

      const t=S.tasks.find(x=>x.id===ds.id);if(!t)break;

    case 'settheme':S.theme=ds.v;persist();render();renderSettings();break;

    /* task sheet */
    case 'pdate':F.date=+ds.d;renderTaskSheet(true);break;
    case 'pprev':{syncF();let m=F.pm-1,y=F.py;if(m<1){m=12;y--}F.pm=m;F.py=y;renderTaskSheet(true);break}
    case 'pnext':{syncF();let m=F.pm+1,y=F.py;if(m>12){m=1;y++}F.pm=m;F.py=y;renderTaskSheet(true);break}
    case 'qdate':{syncF();F.date=T+(+ds.n);const p=d2j(F.date);F.py=p.jy;F.pm=p.jm;renderTaskSheet(true);break}
    case 'tmode':{
      syncF();F.timed=ds.v==='1';
      if(F.timed&&!F.time){F.time=pad((new Date().getHours()+1)%24)+':00'}
      renderTaskSheet(true);break}
    case 'qtime':syncF();F.time=ds.t;renderTaskSheet(true);break;
    case 'pdur':syncF();F.dur=+ds.v;renderTaskSheet(true);break;
    case 'prem':syncF();F.rem=+ds.v;renderTaskSheet(true);break;
    case 'pickcat':syncF();F.cat=ds.c||null;renderTaskSheet(true);break;
    case 'pickrep':syncF();F.repeat=ds.r;renderTaskSheet(true);break;
    case 'save':saveTask();break;
    case 'del':{
      const t=S.tasks.find(x=>x.id===F.id);if(!t)break;
      S.tasks=S.tasks.filter(x=>x.id!==t.id);kill(t.id);persist();closeSheet();render();
      toast('کار حذف شد','بازگردانی',()=>{delete S.dead[t.id];S.tasks.push(touch(t));persist();render()},6000);break}
    case 'ics':{
      syncF();const t=S.tasks.find(x=>x.id===F.id);
      if(t){exportICS(t);toast('فایل تقویم ساخته شد؛ آن را باز کن تا به تقویم گوشی اضافه شود.')}
      break}

    /* category sheet */
    case 'editcat':CS.edit=CS.edit===ds.c?null:ds.c;renderCats(true);break;
    case 'setcolor':{
      if(ds.c==='new')CS.nc.color=ds.col;else{const c=S.cats.find(x=>x.id===ds.c);c.color=ds.col;touch(c);persist();render()}
      renderCats(true);break}
    case 'seticon':{
      if(ds.c==='new')CS.nc.icon=ds.ic;else{const c=S.cats.find(x=>x.id===ds.c);c.icon=ds.ic;touch(c);persist();render()}
      renderCats(true);break}
    case 'delcat':{
      const c=S.cats.find(x=>x.id===ds.c);
      if(confirm('دسته‌ی «'+c.name+'» حذف شود؟ کارهای این دسته بدون دسته می‌مانند.')){
        S.cats=S.cats.filter(x=>x.id!==c.id);kill(c.id);S.tasks.forEach(t=>{if(t.cat===c.id){t.cat=null;touch(t)}});
        if(U.filter===c.id)U.filter=null;CS.edit=null;persist();render();renderCats(true);
      }
      break}
    case 'addcat':{
      const inp=$('#nc-name'),name=inp.value.trim();
      if(!name){inp.classList.add('err');inp.focus();return}
      S.cats.push(touch({id:uid(),name,color:CS.nc.color,icon:CS.nc.icon}));
      CS.nc={name:'',color:PALETTE[(PALETTE.indexOf(CS.nc.color)+1)%PALETTE.length],icon:'star'};
      persist();render();renderCats(true);break}

    /* settings */
    case 'notif':
      if('Notification' in window)Notification.requestPermission().then(()=>renderSettings());
      break;
    case 'testnotif':sysNotify('یادآوری آزمایشی','اعلان‌ها روی این دستگاه فعال است.','test');toast('اعلان آزمایشی ارسال شد');break;
    case 'gsignin':signIn();break;
    case 'gsignout':signOutUser();break;
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall=null;renderSettings()}break;
    case 'export':downloadBlob(new Blob([JSON.stringify({cats:S.cats,tasks:S.tasks,notes:S.notes,log:S.log,badges:S.badges,profile:S.profile},null,1)],{type:'application/json'}),'tasks-backup.json');break;
    case 'import':$('#imp').click();break;
    case 'pinset':openSetPin();break;
    case 'pinoff':if(confirm('قفل برنامه برداشته شود؟')){saveLock(null);renderSettings()}break;
    case 'ps':setPinInput(ds.k);break;
    case 'lk':lockInput(ds.k);break;
    case 'lkforget':
      if(confirm('با ادامه، اطلاعات این دستگاه پاک می‌شود و قفل برداشته می‌شود. اگر با گوگل وارد شده بودی، بعد از ورود دوباره برمی‌گردند. ادامه می‌دهی؟')){
        saveLock(null);LOCKED=false;$('#lock').hidden=true;wipeLocal();
      }
      break;
    case 'wipe':
      if(confirm('همه‌ی اطلاعات این دستگاه پاک شود؟ (اطلاعات ابری در صورت ورود با گوگل باقی می‌ماند)'))wipeLocal();
      break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('catname')){
    const c=S.cats.find(x=>x.id===el.dataset.c),v=el.value.trim();
    if(c&&v){c.name=v.slice(0,24);touch(c);persist();render()}else if(c)el.value=c.name;
  }
  if(el.id==='pf-name'){
    const v=el.value.trim();
    if(v){if(!S.profile)S.profile={name:v,gender:'n',u:0};S.profile.name=v.slice(0,40);touch(S.profile);persist();render()}
  }
  if(el.id==='f-h'||el.id==='f-mi')syncF();
  if(el.id==='imp'&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||typeof d!=='object'||!Array.isArray(d.cats)||!Array.isArray(d.tasks))throw 0;
        if(confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟')){
          S.cats=cleanList(d.cats,cleanCat,100);S.tasks=cleanList(d.tasks,cleanTask,5000);S.notes=cleanList(d.notes,cleanNote,2000);
          S.log=cleanList(d.log,cleanLog,20000);S.badges=cleanBadges(d.badges);const pr=cleanProfile(d.profile);if(pr)S.profile=pr;
          S.seeded=true;U.filter=null;normalize();
          const now=Date.now();[S.cats,S.tasks,S.notes,S.log].forEach(a=>a.forEach(x=>{x.u=now}));
          persist();render();renderSettings();
        }
      }catch(err){alert('فایل پشتیبان معتبر نیست.')}
      el.value='';
    };
    r.readAsText(el.files[0]);
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList.contains('err'))el.classList.remove('err');
  if(el.id==='nc-name')CS.nc.name=el.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!sheetLocked)closeSheet();
  if(e.key==='Enter'&&e.target.id==='f-title')saveTask();
  if(e.key==='Enter'&&e.target.id==='ob-name')saveOnboarding();
  if(e.key==='Enter'&&e.target.id==='qi'){const b=document.querySelector('[data-act=qadd]');if(b)b.click()}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='nq'){const b=document.querySelector('[data-act=nadd]');if(b)b.click()}
  if(e.key==='Enter'&&e.target.id==='nc-name'){const b=document.querySelector('[data-act=addcat]');if(b)b.click()}
});

/* swipe: month on the calendar tab, week on the plan tab */
let sx=null,sy=null,swArea=null;
document.addEventListener('touchstart',e=>{
  swArea=e.target.closest('#mcal')?'m':e.target.closest('.wk')?'w':null;
  if(swArea){sx=e.touches[0].clientX;sy=e.touches[0].clientY}
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!swArea)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  const area=swArea;swArea=null;
  if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx))return;
  const dir=dx<0?1:-1;
  if(area==='m')shiftMonth(dir);else{setSel(U.sel+7*dir);render()}
},{passive:true});

/* live refresh: countdown, now-line, reminders, new day, auto-lock */
function tick(){
  if(LOCKED)return;
  const n=todayJ();
  if(n!==T){T=n;setSel(T);render()}
  checkReminders();
  if(U.tab==='plan'&&!sheetOpen()){
    const h=$('#hero');if(h)h.innerHTML=heroHTML();
    const nl=$('#nowline');
    if(nl){const d=new Date(),m=d.getHours()*60+d.getMinutes();nl.style.top=((m-(+nl.dataset.s)*60)/60*(+nl.dataset.hh))+'px'}
  }
}
setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(lockCfg()&&!LOCKED&&hiddenAt&&Date.now()-hiddenAt>30000){showLock();return}
  tick();if(!sheetOpen())render();
});

/* ======================= Boot ======================= */
render();
if(lockCfg())showLock();
else if(!S.profile)openOnboarding();
checkReminders();
initSync();
if(!LOCKED&&/[?&]add=1/.test(location.search)){openTask(null);try{history.replaceState(null,'',location.pathname)}catch(e){}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
